# Deploy the built game to GitHub Pages.
#
# This started life as GitHub's "static content" starter, added by the web UI
# when Pages was enabled. That version uploaded `path: '.'` — the repository
# root, unbuilt — which cannot work here: the root `index.html` is Vite's dev
# entry and asks the browser for `/src/main.ts`, a TypeScript module no browser
# will execute. It has to be built first, and `dist/` uploaded instead.
#
# What this deploys is the single-player campaign only. Race mode needs the
# relay in `server/`, and Pages serves static files with no process behind
# them, so the lobby will not find a socket here. Hosting Race needs somewhere
# that can run `npm run play`.
name: Deploy static content to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time, and never cancel one in flight.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # The npm scripts all shell through zsh, which current ubuntu runners no
      # longer preinstall. Same line, and same reason, as ci.yml.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # `npm run build` typechecks before bundling, so a broken main cannot
      # quietly publish.
      - run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
